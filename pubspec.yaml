name: aira_app
description: "AiRA — AI assistant app for beauty & makeup artists (Sunndari)"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  pin_code_fields: ^9.4.0
  google_sign_in: ^7.1.1
  cupertino_icons: ^1.0.8
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  web_socket_channel: ^3.0.3
  change_app_package_name: ^1.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^19.5.0
  permission_handler: 11.3.1
  device_info_plus: ^11.3.0
  app_settings: ^5.1.1
  package_info_plus: ^9.0.1
  android_intent_plus: ^6.1.0
  geolocator: 13.0.4
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/aira_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/aira_logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/icon/aira_logo.png
    - assets/images/splash_bg.png
    - assets/images/sunndari_logo.png